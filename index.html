<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #007BFF;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#about">About Us</a>
        <a href="#contact">Contact Us</a>
        <a href="#products">Products</a>
    </nav>

    <section id="about">
        <h2>About Us</h2>
        <p>Welcome to our website! We are dedicated to providing the best products and services.</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>You can reach us at contact@example.com or call us at (123) 456-7890.</p>
    </section>

    <section id="products">
        <h2>Products</h2>
        <p>Check out our amazing range of products that cater to all your needs!</p>
    </section>

</body>
</html>
